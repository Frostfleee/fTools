[package]
name = "ftools"
version = "0.9.4"
description = "fTools"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "ico", "tiff", "webp", "avif"] }
img-parts = "0.4"
libheif-rs = { version = "2", features = ["latest"] }
ico = "0.5"
symphonia = { version = "0.5", features = ["all"] }
hound = "3"
flacenc = "0.5"
mp3lame-encoder = "0.2"
vorbis_rs = "0.5"
opus-rs = "0.1"
ogg = "0.9"
rubato = "0.15"
windows = { version = "0.62", features = [
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
] }
tauri-plugin-single-instance = "2.4.3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[[bin]]
name = "ftools"
path = "src/main.rs"
