"$schema" = "../gen/schemas/desktop-schema.json"

[[permission]]
identifier = "allow-app-commands"
description = "Allows this app's own file-conversion, blur-patch, and autoclicker commands"
commands.allow = ["existing_output_folder", "convert_image", "convert_audio", "convert_video", "start_autoclicker_loop", "bump_autoclicker_generation"]